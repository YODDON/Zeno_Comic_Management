name: zeno-comic-management

x-database-environment: &database-environment
  POSTGRES_DB: ${POSTGRES_DB:-comic_management}
  POSTGRES_USER: ${POSTGRES_USER:-comic_management}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the deployment environment}

x-application-connection: &application-connection
  ConnectionStrings__Database: Host=postgres;Port=5432;Database=${POSTGRES_DB:-comic_management};Username=${POSTGRES_USER:-comic_management};Password=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD};Pooling=true;Include Error Detail=false

services:
  postgres:
    image: postgres:18.0-alpine3.22
    environment: *database-environment
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    volumes:
      - postgres_data:/var/lib/postgresql
    networks:
      - backend
    restart: unless-stopped

  migrate:
    image: ${IMAGE_REGISTRY:?Set IMAGE_REGISTRY}/migrator:${IMAGE_TAG:?Set immutable IMAGE_TAG}
    environment: *application-connection
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - backend
    restart: "no"

  data-protection-init:
    image: ${IMAGE_REGISTRY:?Set IMAGE_REGISTRY}/api:${IMAGE_TAG:?Set immutable IMAGE_TAG}
    user: "0:0"
    entrypoint:
      - /bin/sh
      - -ec
      - install -d -o "$${APP_UID:-1654}" -g "$${APP_UID:-1654}" -m 0700 /var/lib/comic-management/data-protection
    volumes:
      - data_protection_keys:/var/lib/comic-management/data-protection
    network_mode: none
    restart: "no"

  api:
    image: ${IMAGE_REGISTRY:?Set IMAGE_REGISTRY}/api:${IMAGE_TAG:?Set immutable IMAGE_TAG}
    environment:
      <<: *application-connection
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
      Authentication__Google__ClientId: ${GOOGLE_CLIENT_ID:?Set GOOGLE_CLIENT_ID}
      Authentication__Google__ClientSecret: ${GOOGLE_CLIENT_SECRET:?Set GOOGLE_CLIENT_SECRET}
      Authentication__SessionLifetime: ${AUTH_SESSION_LIFETIME:-08:00:00}
      Authentication__DataProtectionKeysPath: /var/lib/comic-management/data-protection
      Authentication__DataProtectionCertificatePath: /run/secrets/data_protection_certificate
      Authentication__DataProtectionCertificatePassword: ${DATA_PROTECTION_CERTIFICATE_PASSWORD:?Set DATA_PROTECTION_CERTIFICATE_PASSWORD}
      Authentication__LoginRateLimit__PermitLimit: ${LOGIN_RATE_LIMIT_PERMIT_LIMIT:-10}
      Authentication__LoginRateLimit__Window: ${LOGIN_RATE_LIMIT_WINDOW:-00:01:00}
      Api__ErrorDocumentationBaseUri: ${ERROR_DOCUMENTATION_BASE_URI:?Set ERROR_DOCUMENTATION_BASE_URI to an HTTPS URI}
      Cloudinary__CloudName: ${CLOUDINARY_CLOUD_NAME:?Set CLOUDINARY_CLOUD_NAME}
      Cloudinary__ApiKey: ${CLOUDINARY_API_KEY:?Set CLOUDINARY_API_KEY}
      Cloudinary__ApiSecret: ${CLOUDINARY_API_SECRET:?Set CLOUDINARY_API_SECRET}
      Cloudinary__ChapterPagePublicIdPrefix: ${CLOUDINARY_CHAPTER_PAGE_PREFIX:-comic-management/chapter-pages}
      Cloudinary__MaximumChapterPageBytes: ${CLOUDINARY_MAXIMUM_CHAPTER_PAGE_BYTES:-10485760}
      Billing__RefundSecurity__CurrentFingerprintVersion: ${REFUND_FINGERPRINT_VERSION:-v1}
      Billing__RefundSecurity__FingerprintKeys__v1: ${REFUND_FINGERPRINT_KEY_V1:?Set REFUND_FINGERPRINT_KEY_V1}
      Billing__RefundSecurity__CurrentProtectionVersion: ${REFUND_PROTECTION_VERSION:-v1}
      Billing__TopUpOrderTtlMinutes: ${TOPUP_ORDER_TTL_MINUTES:-30}
      Membership__VipOrderTtlMinutes: ${VIP_ORDER_TTL_MINUTES:-30}
      Billing__SePayWebhook__Enabled: ${SEPAY_WEBHOOK_ENABLED:-false}
      Billing__SePayWebhook__Secret: ${SEPAY_WEBHOOK_SECRET:-}
      Billing__SePayWebhook__ExpectedAccountNumber: ${SEPAY_EXPECTED_ACCOUNT_NUMBER:-}
      Billing__SePayWebhook__TimestampToleranceSeconds: ${SEPAY_TIMESTAMP_TOLERANCE_SECONDS:-300}
      Billing__SePayWebhook__MaximumBodyBytes: ${SEPAY_MAXIMUM_BODY_BYTES:-65536}
      Billing__SePayWebhook__PermitLimitPerMinute: ${SEPAY_PERMIT_LIMIT_PER_MINUTE:-120}
      ReverseProxy__KnownNetworks__0: ${COMPOSE_SUBNET:-172.30.0.0/24}
    secrets:
      - data_protection_certificate
    volumes:
      - data_protection_keys:/var/lib/comic-management/data-protection
    tmpfs:
      - /tmp:size=64m,mode=1777
    depends_on:
      migrate:
        condition: service_completed_successfully
      data-protection-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "http://localhost:8080/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks:
      - edge
      - backend
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true

  web:
    image: ${IMAGE_REGISTRY:?Set IMAGE_REGISTRY}/web:${IMAGE_TAG:?Set immutable IMAGE_TAG}
    environment:
      APP_ADDRESS: ${APP_ADDRESS:-http://localhost}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy
    networks:
      - edge
      - backend
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    security_opt:
      - no-new-privileges:true

  backup:
    profiles: ["ops"]
    image: ${IMAGE_REGISTRY:?Set IMAGE_REGISTRY}/ops:${IMAGE_TAG:?Set immutable IMAGE_TAG}
    environment:
      DATABASE_HOST: postgres
      DATABASE_NAME: ${POSTGRES_DB:-comic_management}
      DATABASE_USER: ${POSTGRES_USER:-comic_management}
      PGPASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      BACKUP_AGE_RECIPIENT: ${BACKUP_AGE_RECIPIENT:?Set BACKUP_AGE_RECIPIENT}
    volumes:
      - ${BACKUP_DIRECTORY:-./backups}:/backups
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - backend
    entrypoint: ["/opt/comic-management/backup.sh"]
    restart: "no"

  restore-postgres:
    profiles: ["ops"]
    image: postgres:18.0-alpine3.22
    environment:
      POSTGRES_DB: comic_management_restore
      POSTGRES_USER: ${POSTGRES_USER:-comic_management}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - restore_postgres_data:/var/lib/postgresql
    networks:
      - backend
    restart: "no"

  restore-drill:
    profiles: ["ops"]
    image: ${IMAGE_REGISTRY:?Set IMAGE_REGISTRY}/ops:${IMAGE_TAG:?Set immutable IMAGE_TAG}
    environment:
      TARGET_DATABASE_HOST: restore-postgres
      TARGET_DATABASE_NAME: comic_management_restore
      DATABASE_USER: ${POSTGRES_USER:-comic_management}
      PGPASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      BACKUP_FILE: ${BACKUP_FILE:-}
      RESTORE_DESTRUCTIVE_CONFIRMATION: ${RESTORE_DESTRUCTIVE_CONFIRMATION:-}
    secrets:
      - backup_age_identity
    volumes:
      - ${BACKUP_DIRECTORY:-./backups}:/backups:ro
    depends_on:
      restore-postgres:
        condition: service_healthy
    networks:
      - backend
    entrypoint: ["/opt/comic-management/restore-drill.sh"]
    restart: "no"

secrets:
  data_protection_certificate:
    file: ${DATA_PROTECTION_CERTIFICATE_FILE:?Set DATA_PROTECTION_CERTIFICATE_FILE}
  backup_age_identity:
    file: ${BACKUP_AGE_IDENTITY_FILE:?Set BACKUP_AGE_IDENTITY_FILE}

volumes:
  postgres_data:
  restore_postgres_data:
  data_protection_keys:
  caddy_data:
  caddy_config:

networks:
  edge:
  backend:
    internal: true
    ipam:
      config:
        - subnet: ${COMPOSE_SUBNET:-172.30.0.0/24}
