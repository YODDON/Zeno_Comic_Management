services:
  migrate:
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: migrator

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: api

  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      target: web
      args:
        VITE_API_BASE_URL: ""

  backup:
    build:
      context: .
      dockerfile: deployment/ops/Dockerfile

  restore-drill:
    build:
      context: .
      dockerfile: deployment/ops/Dockerfile
