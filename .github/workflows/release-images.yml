name: Publish release images

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"
      - "d01-rc-*"

permissions:
  contents: read
  packages: write

concurrency:
  group: release-images-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set immutable image namespace
        shell: bash
        run: echo "IMAGE_ROOT=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Authenticate to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Publish API
        id: api
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: backend/Dockerfile
          target: api
          push: true
          tags: ${{ env.IMAGE_ROOT }}/api:${{ github.sha }}
          build-args: RELEASE_REVISION=${{ github.sha }}
          provenance: mode=max
          sbom: true

      - name: Publish migrator
        id: migrator
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: backend/Dockerfile
          target: migrator
          push: true
          tags: ${{ env.IMAGE_ROOT }}/migrator:${{ github.sha }}
          build-args: RELEASE_REVISION=${{ github.sha }}
          provenance: mode=max
          sbom: true

      - name: Publish web
        id: web
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: frontend/Dockerfile
          target: web
          push: true
          tags: ${{ env.IMAGE_ROOT }}/web:${{ github.sha }}
          build-args: RELEASE_REVISION=${{ github.sha }}
          provenance: mode=max
          sbom: true

      - name: Publish operations image
        id: ops
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: deployment/ops/Dockerfile
          push: true
          tags: ${{ env.IMAGE_ROOT }}/ops:${{ github.sha }}
          build-args: RELEASE_REVISION=${{ github.sha }}
          provenance: mode=max
          sbom: true

      - name: Generate digest-pinned release manifest
        shell: bash
        env:
          API_DIGEST: ${{ steps.api.outputs.digest }}
          MIGRATOR_DIGEST: ${{ steps.migrator.outputs.digest }}
          WEB_DIGEST: ${{ steps.web.outputs.digest }}
          OPS_DIGEST: ${{ steps.ops.outputs.digest }}
        run: |
          set -euo pipefail
          migration_id="$(find backend/src/ComicManagement.Persistence/Migrations -maxdepth 1 \
            -type f -name '[0-9]*_*.cs' ! -name '*.Designer.cs' -printf '%f\n' | sort | tail -n 1 | sed 's/\.cs$//')"
          created_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          mkdir -p release
          cat >release/release-manifest.env <<EOF
          RELEASE_GIT_SHA=${GITHUB_SHA}
          RELEASE_CREATED_AT=${created_at}
          CURRENT_MIGRATION_ID=${migration_id}
          API_IMAGE_REFERENCE=${IMAGE_ROOT}/api@${API_DIGEST}
          API_IMAGE_DIGEST=${API_DIGEST}
          WEB_IMAGE_REFERENCE=${IMAGE_ROOT}/web@${WEB_DIGEST}
          WEB_IMAGE_DIGEST=${WEB_DIGEST}
          MIGRATOR_IMAGE_REFERENCE=${IMAGE_ROOT}/migrator@${MIGRATOR_DIGEST}
          MIGRATOR_IMAGE_DIGEST=${MIGRATOR_DIGEST}
          OPS_IMAGE_REFERENCE=${IMAGE_ROOT}/ops@${OPS_DIGEST}
          OPS_IMAGE_DIGEST=${OPS_DIGEST}
          EOF
          sh deployment/scripts/validate-release-manifest.sh release/release-manifest.env

      - name: Upload release manifest
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: release-manifest-${{ github.sha }}
          path: release/release-manifest.env
          if-no-files-found: error
          retention-days: 90
