name: CI

on:
  push:
    branches:
      - main
      - dev
      - "feature/**"
      - "bugfix/**"
      - "hotfix/**"
      - "refactor/**"
      - "test/**"
      - "chore/**"
  pull_request:
    branches:
      - main
      - dev
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "true"

jobs:
  backend:
    name: Backend build and tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Restore backend dependencies
        run: dotnet restore ComicManagement.slnx

      - name: Build backend
        run: dotnet build ComicManagement.slnx --configuration Release --no-restore

      - name: Run backend tests
        run: >-
          dotnet test ComicManagement.slnx
          --configuration Release
          --no-build
          --no-restore
          --logger trx
          --results-directory "${{ github.workspace }}/TestResults"

      - name: Upload backend test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v5
        with:
          name: backend-test-results
          path: TestResults/**/*.trx
          if-no-files-found: ignore
          retention-days: 14

  frontend:
    name: Frontend build and tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Lint frontend
        run: npm run lint

      - name: Run frontend unit tests
        run: npm test

      - name: Build frontend
        run: npm run build

      - name: Install Chrome for Playwright
        run: npx playwright install --with-deps chrome

      - name: Run frontend end-to-end tests
        run: npm run test:e2e
        env:
          CI: "true"

      - name: Set up .NET for real integration E2E
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Run real browser API PostgreSQL E2E
        run: npm run test:e2e:integration
        env:
          CI: "true"

      - name: Upload Playwright evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v5
        with:
          name: playwright-evidence
          path: |
            frontend/artifacts/
            frontend/playwright-report/
            frontend/test-results/
            frontend/test-results-integration/
          if-no-files-found: ignore
          retention-days: 14
